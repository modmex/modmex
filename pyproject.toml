[project]
name = "modmex"
version = "1.0.1"
description = "Lightweight Python models built on dataclasses with validation, serialization, and type-safe data mapping"
authors = [
    {name = "clandro89@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "orjson>=3.11.9,<4.0.0",
]


[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "modmex-core/Cargo.toml"
python-source = "."
module-name = "modmex._modmex_rust"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
coverage = "^7.14.1"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["modmex"]

[tool.coverage.report]
show_missing = true
skip_covered = true
