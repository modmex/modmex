[project]
name = "modmex"
version = "1.1.15"
description = "Lightweight Python models built on dataclasses with validation, serialization, and type-safe data mapping"
authors = [
    {name = "clandro89@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "orjson>=3.11.9,<4.0.0",
]


[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "modmex-core/Cargo.toml"
python-source = "."
module-name = "modmex._modmex_rust"
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "modmex/py.typed", format = "sdist" },
    { path = "modmex/py.typed", format = "wheel" },
    { path = "modmex/*.pyi", format = "sdist" },
    { path = "modmex/*.pyi", format = "wheel" },
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
coverage = "^7.14.1"
pytest-cov = "^7.1.0"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["modmex"]

[tool.coverage.report]
show_missing = true
skip_covered = true
